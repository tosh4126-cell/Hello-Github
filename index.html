<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Yasser ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle, #35101f, #09000b 75%);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Georgia, serif;
    color: white;
}

.stars {
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(white 1px, transparent 1px);
    background-size: 45px 45px;
    opacity: .25;
    animation: sparkle 4s infinite alternate;
}

@keyframes sparkle {
    from {opacity: .12;}
    to {opacity: .4;}
}

.container {
    text-align: center;
    z-index: 2;
    padding: 20px;
}

.subtitle {
    color: #ffb5ca;
    letter-spacing: 5px;
    font-size: 12px;
    margin-bottom: 25px;
}

.heart {
    position: relative;
    width: 220px;
    height: 200px;
    margin: auto;
    animation: beat 1.2s infinite;
    filter: drop-shadow(0 0 20px #ff174d);
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 110px;
    height: 175px;
    background: linear-gradient(135deg,#ff789a,#d90045);
    border-radius: 110px 110px 0 0;
}

.heart::before {
    left: 110px;
    transform: rotate(-45deg);
    transform-origin: 0 100%;
}

.heart::after {
    left: 0;
    transform: rotate(45deg);
    transform-origin: 100% 100%;
}

.name {
    position: absolute;
    z-index: 5;
    width: 100%;
    top: 100px;
    left: 0;
    font-family: Georgia, serif;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 3px;
    color: white;
    text-shadow: 0 0 12px white;
}

@keyframes beat {
    0%,100% {transform: scale(1);}
    50% {transform: scale(1.12);}
}

.message {
    margin-top: 35px;
    font-size: 23px;
    color: #ffc3d4;
    text-shadow: 0 0 15px #ff174d;
}

.small {
    margin-top: 15px;
    color: #e9b6c7;
    font-size: 14px;
    letter-spacing: 2px;
}

button {
    margin-top: 30px;
    padding: 14px 30px;
    border: 1px solid #ff7198;
    border-radius: 30px;
    background: transparent;
    color: white;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 0 15px #ff174d;
}

button:hover {
    background: #c90045;
}

.floating {
    position: fixed;
    bottom: -30px;
    color: #ff789a;
    animation: floatUp 8s linear infinite;
    z-index: 1;
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">

    <div class="subtitle">A LITTLE SOMETHING FOR YOU</div>

    <div class="heart">
        <div class="name">YASSER</div>
    </div>

    <div class="message">I Wanna Be Yours ❤️</div>

    <div class="small">YOU ARE MY FAVORITE PERSON</div>

    <button onclick="playMusic()" id="musicBtn">
        ♫ Play Our Song
    </button>

    <audio id="song" src="song.mp3" loop></audio>

</div>

<script>
function playMusic() {
    const song = document.getElementById("song");
    const btn = document.getElementById("musicBtn");

    if (song.paused) {
        song.play();
        btn.innerHTML = "Ⅱ Pause Music";
    } else {
        song.pause();
        btn.innerHTML = "♫ Play Our Song";
    }
}

// Floating hearts
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "floating";
    heart.innerHTML = "♥";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random()*25) + "px";
    heart.style.animationDuration = (5 + Math.random()*5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 10000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
